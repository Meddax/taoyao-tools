# uapicheck units: the vendor-facing headers, per tree.
#
# 54.*  = the 5.4 headers the taoyao vendor userspace was built with
#         (taoyao-stock = Xiaomi taoyao 5.4 OSS, branch taoyao-s-oss), only
#         read by `uapicheck.py ref`; ref/ holds the result
# 612.* = the 6.12 tree (K = genie1997 redwood-6.12 + port-6.12/patches)
# A key without a side prefix applies to both.
#
#   inc      include dirs, relative to the tree, searched before include/uapi
#            and arch/<arch>/include/uapi
#   hdr      headers as #include'd (<...>), probed as userspace sees them
#   extract  kernel-internal headers (path in the tree) whose ioctl part is
#            the ABI (libadsprpc, the fingerprint/touch/NFC HALs carry their
#            own copy): only #defines and struct/union/enum/typedef
#            definitions are kept, the ones that need kernel-only types drop
#            out (listed as notes)
#   root     tree name for --tree NAME=DIR (default main); the 5.4 qcacld is
#            not in taoyao-stock, it comes from LineageOS 5.4 (t)
#   define   extra -D for the probe
#   ref      the 5.4 reference `check` compares the unit with (default st):
#            st  = ref/5.4.txt, stock HyperOS (taoyao-stock); it holds every
#                  unit
#            los = ref/5.4-los.txt, the LineageOS 5.4 kernel headers that
#                  Evolution X and crDroid build ipacm from source with
#                  (taoyao54 = skglab lineage-23.2, the same msm_ipa.h,
#                  rmnet_ipa_fd_ioctl.h and ipa_qmi_service_v01.h as EvoX's
#                  arunika and taoyao-labs lineage-24.0 kernels); the unit's
#                  5.4 side is read from tree t. taoyao's native IPA/WAN
#                  layout is this one; stock HyperOS's older IPA layout is
#                  translated by ipam (uapi_stock=1), `check --unit-ref
#                  ipa=st` lists what that translation has to cover
#
# Changing a 54.* or ref line needs `uapicheck.py ref` (check refuses a
# stale ref/).
#
# Left out on purpose: the msm_audio_<codec>.h headers of native_dlkm (no
# legacy OMX audio component in any taoyao vendor), rmnet_data.h (nothing in
# 5.4 implements it), upstream misc/fastrpc.h (libadsprpc uses
# /dev/adsprpc-smd), asound.h (tinyalsa uses bionic's copy), FM, SPSS, NPU,
# CVP/synx and QG/QBG (no such hardware or driver on taoyao).

[ion]
hdr = linux/ion.h linux/msm_ion.h linux/msm_ion_ids.h

[ashmem]
inc = drivers/staging/android/uapi
hdr = ashmem.h

[binder]
hdr = linux/android/binder.h linux/android/binderfs.h

[ipa]
612.inc = techpack/dataipa/drivers/platform/msm/include/uapi
hdr = linux/msm_ipa.h linux/rmnet_ipa_fd_ioctl.h linux/ipa_qmi_service_v01.h
ref = los

[rmnet]
hdr = linux/msm_rmnet.h
ref = los

[fastrpc]
54.extract = drivers/char/adsprpc_shared.h
612.inc = techpack/dsp/include/uapi
612.hdr = fastrpc_shared.h
612.extract = techpack/dsp/dsp/adsprpc_shared.h

[camera]
54.inc = techpack/camera/include/uapi
612.inc = techpack/camera/include/uapi techpack/camera/include/uapi/camera
hdr = camera/media/cam_defs.h camera/media/cam_cpas.h camera/media/cam_custom.h
      camera/media/cam_fd.h camera/media/cam_icp.h camera/media/cam_isp.h
      camera/media/cam_isp_ife.h camera/media/cam_isp_sfe.h camera/media/cam_isp_tfe.h
      camera/media/cam_isp_vfe.h camera/media/cam_jpeg.h camera/media/cam_lrme.h
      camera/media/cam_ope.h camera/media/cam_req_mgr.h camera/media/cam_sensor.h
      camera/media/cam_sync.h camera/media/cam_tfe.h

[audio]
inc = techpack/audio/include/uapi
54.hdr = audio/linux/msm_audio.h audio/linux/msm_audio_calibration.h audio/linux/avtimer.h
         audio/sound/audio_compressed_formats.h audio/sound/audio_effects.h
         audio/sound/devdep_params.h audio/sound/lsm_params.h audio/sound/msmcal-hwdep.h
         audio/sound/voice_params.h
54.extract = techpack/audio/asoc/msm-ds2-dap-config.h
612.hdr = linux/msm_audio.h linux/msm_audio_calibration.h
          sound/audio_compressed_formats.h sound/audio_effects.h
          sound/devdep_params.h sound/lsm_params.h sound/msmcal-hwdep.h
          sound/voice_params.h linux/msm-ds2-dap-config.h linux/msm-dolby-common.h

[compress]
hdr = sound/compress_offload.h sound/compress_params.h
# the QC compress extensions moved from the UAPI headers into the driver
612.extract = techpack/audio/asoc/compress_ext.h

[elliptic]
extract = techpack/audio/include/elliptic/elliptic_device.h

[display]
# drm_fourcc.h first: 6.12 moved the QCOM format modifiers to sde_drm.h,
# which takes fourcc_mod_code() from it
inc = techpack/display/include/uapi
hdr = drm/drm_fourcc.h drm/msm_drm.h display/drm/sde_drm.h display/drm/msm_drm_pp.h
      display/drm/mi_disp.h display/hdcp/msm_hdmi_hdcp_mgr.h
54.hdr = drm/drm_fourcc.h drm/msm_drm.h display/drm/sde_drm.h display/drm/msm_drm_pp.h
         display/drm/mi_disp.h display/hdcp/msm_hdmi_hdcp_mgr.h display/media/msm_sde_rotator.h

[kgsl]
612.inc = techpack/graphics/include/uapi
hdr = linux/msm_kgsl.h

[video]
inc = techpack/video/include/uapi
hdr = vidc/media/msm_vidc_utils.h vidc/media/msm_media_info.h

[v4l2]
hdr = linux/videodev2.h linux/v4l2-controls.h linux/media.h

[securemsm]
54.hdr = linux/qseecom.h linux/smcinvoke.h linux/qcedev.h linux/qcota.h linux/fips_status.h
612.inc = techpack/securemsm/include/uapi techpack/securemsm/smcinvoke
612.hdr = linux/qseecom.h linux/qseecom_api.h smcinvoke.h linux/qcedev.h linux/qcota.h
# fips_status.h and the 64-bit SG list header (5.4 UAPI) live in the driver
612.extract = techpack/securemsm/crypto-qti/fips_status.h techpack/securemsm/qseecom/qseecom.c

[nl80211]
hdr = linux/nl80211.h

[wlan-vendor]
54.root = t
54.extract = drivers/staging/qca-wifi-host-cmn/os_if/linux/qca_vendor.h
612.extract = techpack/wlan/qcacld-3.0/cmn/os_if/linux/qca_vendor.h

[touch]
54.extract = drivers/input/touchscreen/xiaomi/xiaomi_touch.h
612.hdr = linux/xiaomi_touch.h
612.extract = techpack/touch/xiaomi/xiaomi_touch.h

[fingerprint]
54.extract = drivers/input/fingerprint/goodix_fod/gf_spi.h
612.extract = techpack/fingerprint/goodix_fod/gf_spi.h

[nfc]
54.extract = drivers/nfc/qti/nfc_common.h
612.inc = techpack/nfc/include/uapi
612.hdr = linux/nfc/nfcinfo.h linux/nfc/sn_uapi.h
612.extract = techpack/nfc/nfc/common.h
